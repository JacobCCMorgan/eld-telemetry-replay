name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: replay the published stream and rebuild the report
        run: eldreplay report --out /tmp/ci_reports
      - name: the committed report matches a fresh run
        run: diff reports/replay_report.md /tmp/ci_reports/replay_report.md
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: reports
          path: /tmp/ci_reports
          retention-days: 7
